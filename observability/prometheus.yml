global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.containers.internal:8000']

  - job_name: 'fastapi-queue'
    metrics_path: '/metrics/queue'
    static_configs:
      - targets: ['host.containers.internal:8000']
